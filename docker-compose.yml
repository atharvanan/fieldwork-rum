services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    environment:
      MONGO_URI: mongodb://mongo:27017/fieldwork
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-only-refresh-secret-change-me}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "4000:4000"

  client:
    build:
      context: ./client
      args:
        API_URL: http://server:4000
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  mongo-data:
