services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/fieldwork}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      INGEST_RATE_PER_MIN: ${INGEST_RATE_PER_MIN:-1200}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "4000:4000"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        API_URL: ${INTERNAL_API_URL:-http://server:4000}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_URL: ${INTERNAL_API_URL:-http://server:4000}
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "3000:3000"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  mongo-data:

