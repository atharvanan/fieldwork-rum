name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    name: SDK (Unit Tests & Bundle Budget)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  server:
    name: Server (Unit & E2E Tests)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:e2e
        env:
          MONGO_URI: mongodb://localhost:27017/fieldwork_test
          JWT_ACCESS_SECRET: ci-test-access-secret-1234567890
          JWT_REFRESH_SECRET: ci-test-refresh-secret-1234567890

  client:
    name: Client (Build & Asset Verification)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          API_URL: http://localhost:4000
          NEXT_TELEMETRY_DISABLED: 1

  browser-e2e:
    name: End-to-End Pipeline & Playwright
    runs-on: ubuntu-latest
    needs: [sdk, server, client]
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build SDK
        working-directory: sdk
        run: |
          npm ci
          npm run build

      - name: Start API Server
        working-directory: server
        env:
          MONGO_URI: mongodb://localhost:27017/fieldwork
          REGISTER_RATE_PER_HOUR: "1000"
          JWT_ACCESS_SECRET: ci-test-access-secret-1234567890
          JWT_REFRESH_SECRET: ci-test-refresh-secret-1234567890
        run: |
          npm ci
          npm run seed
          npm start &

      - name: Build and Start Dashboard
        working-directory: client
        env:
          API_URL: http://localhost:4000
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          npm ci
          npm run build
          npm start &
          npx wait-on http://localhost:3000 http://localhost:4000/api/health

      - name: Run SDK Integration Pipeline
        working-directory: sdk
        env:
          API_URL: http://localhost:4000
        run: |
          npm run test:pipeline

      - name: Run Playwright Tests
        working-directory: client
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7

  docker-build:
    name: Container Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: false
          tags: fieldwork-server:ci

      - name: Build Client Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: false
          build-args: |
            API_URL=http://server:4000
          tags: fieldwork-client:ci
